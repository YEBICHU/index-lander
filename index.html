      Site-ul este doar pe tema deschisa. Cu `light dark`, un sistem cu tema

      descrierea si `og:*`/`twitter:*`. Crawler-ele care nu ruleaza JS vad
      varianta româneasca, declarata si prin `og:locale:alternate`.
    -->

    <link rel="alternate" hreflang="ro" href="https://index.yebichu.com/" />

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />

    -->

      html {

          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          transition: none;
        }
        .boot img {
          animation: none;
          opacity: 0.75;
        }
      }
